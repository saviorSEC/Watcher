# Watcher — Adversarial Testing Protocol
# Tests whether a pattern actively confuses recognition (not just detection).

protocol:
  name: "adversarial"
  version: "1.0"
  description: >
    Adversarial test focused on recognition evasion. Measures embedding
    shift, identity confusion, and whether the pattern causes the model
    to "see" a different identity.

phases:
  - name: "baseline_collection"
    description: "Capture reference embeddings for each persona"
    trials_per_variable: 30

  - name: "pattern_embeddings"
    description: "Capture embeddings with adversarial pattern applied"
    trials_per_variable: 50

  - name: "identity_confusion"
    description: >
      Test if pattern pushes embedding into another persona's region
      (false positive identity match)
    trials_per_variable: 30

variables:
  pattern_placement:
    - "face_only"
    - "face_and_neck"
    - "upper_body"
    - "headband"
    - "scarf"

  pattern_scale:
    - 1.0   # Full size
    - 0.75  # 75% scale
    - 0.5   # Half scale

  camera_type:
    - "webcam"
    - "android"
    - "ip_camera"

  distance_m:
    - 1.0
    - 2.0

detectors:
  - retinaface
  - facenet
  - arcface

metrics:
  primary:
    - detection_rate
    - embedding_distance_l2  # Distance from baseline embedding
    - false_positive_id_rate  # % matched to wrong identity
    - identification_rate     # % correctly identified (lower = better evasion)
  secondary:
    - landmark_error_nme
    - embedding_cluster_variance

pass_conditions:
  # Evasion: embedding shift > 0.5 in L2 space indicates confusion
  - metric: embedding_distance_l2
    threshold: 0.5
    operator: "gte"
    label: "STRONG_CONFUSION"
  - metric: embedding_distance_l2
    threshold: 0.3
    operator: "gte"
    label: "MODERATE_CONFUSION"
  - metric: identification_rate
    threshold: 0.30
    operator: "lte"
    label: "EFFECTIVE_EVASION"
